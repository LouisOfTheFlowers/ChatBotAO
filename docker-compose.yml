services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend
    restart: always
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: llama3.2:1b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      CHROMA_PERSIST_DIRECTORY: /app/chroma_data
      LOCAL_BOOKS_DATA_DIRECTORY: /app/backend/books_data
      LOCAL_BOOKS_CACHE_PATH: /app/backend/books_data/books_cache.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - ./backend/books_data:/app/backend/books_data
    depends_on:
      - ollama

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: rag-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data:
